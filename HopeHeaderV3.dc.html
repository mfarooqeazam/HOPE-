<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#174F59;font-family:'Times New Roman',Tinos,'Liberation Serif',Times,serif">
  <div style="width:min(100% - 40px,1140px);margin-inline:auto;display:flex;align-items:center;gap:24px;min-height:76px;border-bottom:1px solid rgba(255,255,255,.12)">
    <a href="#" style="text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:12.8px">
      <img src="site/assets/img/hope-logo-sm.png" alt="The Project Hope" width="71" height="54" style="height:50px;width:auto;flex:none;display:block">
      <span style="font-weight:700;font-size:20.5px;color:#fff;white-space:nowrap">The Project Hope</span>
    </a>
    <nav aria-label="Main" style="display:flex;gap:4px;align-items:center">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="#" style="font-size:15.7px;text-decoration:none;padding:8.8px 11px;color:{{ l.color }};font-weight:{{ l.weight }};border-bottom:2px solid {{ l.rule }};transition:color .2s" style-hover="color:#fff">{{ l.label }}</a>
      </sc-for>
    </nav>
    <a href="#" style="display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;background:#fff;color:#174F59;transition:transform .2s,background-color .25s" style-hover="background:#C8A96B;transform:translateY(-2px)">{{ cta }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Therapy&quot;,&quot;Training&quot;,&quot;School&quot;,&quot;Why it matters&quot;,&quot;Volunteer&quot;,&quot;About&quot;,&quot;Register&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Talk to us&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current || "Home";
    // Register stays reachable via the CTA button, so the nav keeps 8 items.
    const labels = ["Home", "Therapy", "Training", "School", "Why it matters", "Volunteer", "About", "Contact"];
    return {
      cta: this.props.cta ?? "Talk to us",
      links: labels.map(label => {
        const on = label === cur;
        return {
          label,
          color: on ? "#fff" : "#E9E6DE",
          weight: on ? "700" : "400",
          rule: on ? "#C8A96B" : "transparent"
        };
      })
    };
  }
}
</script>
</body>
</html>
